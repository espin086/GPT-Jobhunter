# Refuses a commit that contains a key, before the commit exists. Install once per clone:
#   pip install pre-commit && pre-commit install
# CI runs the same scanner over the whole history (.github/workflows/secret-scan.yml).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
